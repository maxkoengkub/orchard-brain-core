[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-brain-core"
version = "0.1.0"
description = "Explainable orchard intelligence engine for durian cultivation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maxkoengkub" }]
keywords = ["durian", "orchard", "agriculture", "intelligence", "explainable-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# The core engine is pure standard library — no runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.scripts]
orchard-brain = "src.orchard_brain.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.orchard_brain" = ["py.typed"]

# ───────────────────────────────────────────────────────── pytest
[tool.pytest.ini_options]
# Ensure `from src.orchard_brain import ...` resolves regardless of how
# pytest is invoked (preserves the existing public import path).
pythonpath = ["."]
testpaths = ["tests"]

# ───────────────────────────────────────────────────────── mypy
[tool.mypy]
python_version = "3.11"
files = ["src/orchard_brain"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = false
show_error_codes = true

# ───────────────────────────────────────────────────────── ruff
[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled pragmatically; many cited research strings are long
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
